<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CC50" />
      <stop offset="100%" stop-color="#D4A017" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1500" />
      <stop offset="100%" stop-color="#0A0800" />
    </linearGradient>
  </defs>

  <!-- Black background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Gold border ring -->
  <rect width="512" height="512" rx="115" fill="none"
        stroke="#D4A017" stroke-width="12" opacity="0.6" />

  <!-- Flame -->
  <path d="M 256 90 C 256 90 185 165 212 238 C 228 280 256 302 256 302
           C 256 302 292 270 292 218 C 292 176 256 130 256 90 Z"
        fill="url(#flameGrad)" />
  <!-- Flame inner highlight -->
  <path d="M 256 165 C 256 165 234 208 244 240 C 250 256 256 266 256 266
           C 256 266 271 250 271 220 C 271 198 256 182 256 165 Z"
        fill="#0A0800" opacity="0.35" />

  <!-- Open book -->
  <path d="M 108 282 Q 180 250 256 302 Q 332 250 404 282 L 404 412
           Q 332 382 256 432 Q 180 382 108 412 Z"
        fill="none" stroke="url(#bookGrad)"
        stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Book page lines left -->
  <path d="M 148 322 Q 200 302 256 336"
        fill="none" stroke="#D4A017" stroke-width="12"
        stroke-linecap="round" opacity="0.7" />
  <!-- Book page lines right -->
  <path d="M 364 322 Q 312 302 256 336"
        fill="none" stroke="#D4A017" stroke-width="12"
        stroke-linecap="round" opacity="0.7" />

  <!-- Brand name -->
  <text x="256" y="392"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700"
        font-size="44"
        fill="#D4A017"
        text-anchor="middle"
        letter-spacing="1">ZivaKhata</text>
</svg>